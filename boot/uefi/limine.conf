# X OS - Limine boot configuration
# Kernel cmdline = XNU-style boot-args.
#   -v          verbose serial [boot] logs (macOS verbose boot)
#   (omit -v)   silent serial + grey Apple progress bar only
timeout: 1
verbose: no

/X OS
    protocol: limine
    kernel_path: boot():/boot/x-os.elf
    cmdline: -v
    resolution: 2560x1600
    bpp: 32
