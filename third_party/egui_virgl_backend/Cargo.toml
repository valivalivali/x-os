[package]
name = "egui_virgl_backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
egui = { version = "0.35", default-features = false, features = ["default_fonts"], path = "../egui/crates/egui" }
epaint = { version = "0.35", default-features = false, features = ["default_fonts"], path = "../egui/crates/epaint" }
emath = { version = "0.35", default-features = false, path = "../egui/crates/emath" }
ecolor = { version = "0.35", default-features = false, path = "../egui/crates/ecolor" }
egui_software_backend = { version = "0.0.3", default-features = false, path = "../egui_software_backend" }
